<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مشاريعي | داش بورد</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="index.html"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>داش بورد <small>DASHBOARD</small></a>
  <nav class="nav" id="nav"></nav>
</div></header>
<main class="wrap">
  <div class="page-head">
    <div><h1>مشاريعي</h1><p class="muted">كل مشروع داش بورد مستقل له رابطه وهويته.</p></div>
    <button class="btn btn-primary" type="button" id="new">مشروع جديد</button>
  </div>
  <div id="setup" class="notice" hidden></div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div class="plist" id="list"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.js"></script>
<script type="module">
import { sb, $, requireUser, mountNav, setupNotice } from './assets/js/sb.js';
import { esc, fmtDate } from './assets/js/engine.js';
if (setupNotice($('#setup'))) { $('#new').disabled = true; throw new Error('not configured'); }
const user = await requireUser();
mountNav(user);

async function load() {
  $('#status').textContent = 'جاري التحميل…';
  const { data, error } = await sb.from('projects').select('id,title,topic,brand,is_published,updated_at,template').order('updated_at', { ascending: false });
  if (error) { $('#status').textContent = 'تعذّر تحميل المشاريع. تأكد من تشغيل ملف قاعدة البيانات (schema.sql).'; $('#status').classList.add('err'); return; }
  $('#status').textContent = '';
  if (!data.length) {
    $('#list').innerHTML = `<div class="card empty" style="grid-column:1/-1"><h2>ابدأ أول داش بورد</h2><p class="muted">أنشئ مشروعًا، ارفع ملف Excel، واختر القالب.</p><button class="btn btn-primary" type="button" data-new>مشروع جديد</button></div>`;
    return;
  }
  $('#list').innerHTML = data.map(p => {
    const b = p.brand || {};
    return `<a class="card pcard" href="project.html?id=${p.id}">
      <span class="sw" aria-hidden="true"><i style="background:${esc(b.primary || '#14A89E')}"></i><i style="background:${esc(b.secondary || '#3A4A4F')}"></i><i style="background:${esc(b.accent || '#F2C230')}"></i></span>
      <div><h3>${esc(p.title)}</h3>${p.topic ? `<p class="muted" style="font-size:13.5px">${esc(p.topic)}</p>` : ''}</div>
      <div class="meta"><span>آخر تعديل ${esc(fmtDate(p.updated_at))}</span><span class="pill ${p.is_published ? 'live' : ''}">${p.is_published ? 'منشور' : 'مسودة'}</span></div></a>`;
  }).join('');
}
async function create() {
  $('#new').disabled = true;
  const { data, error } = await sb.from('projects').insert({ title: 'مشروع جديد' }).select('id').single();
  $('#new').disabled = false;
  if (error) { $('#status').textContent = 'تعذّر إنشاء المشروع: ' + error.message; $('#status').classList.add('err'); return; }
  location.href = 'project.html?id=' + data.id;
}
$('#new').addEventListener('click', create);
$('#list').addEventListener('click', e => { if (e.target.closest('[data-new]')) create(); });
load();
</script>
</body>
</html>
