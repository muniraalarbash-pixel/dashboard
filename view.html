<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>داش بورد</title>
<script>try{document.documentElement.dataset.mode=localStorage.getItem("dash-mode")||"bordo"}catch(e){document.documentElement.dataset.mode="bordo"}</script>
<meta name="description" content="داش بورد تفاعلي للعرض فقط. افتح الرابط وتصفح الأرقام وفلترها.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="داش بورد">
<meta property="og:locale" content="ar_SA">
<meta property="og:title" content="داش بورد تفاعلي">
<meta property="og:description" content="داش بورد تفاعلي للعرض فقط. افتح الرابط وتصفح الأرقام وفلترها.">
<meta property="og:url" content="https://muniraalarbash-pixel.github.io/dashboard/view.html">
<meta property="og:image" content="https://muniraalarbash-pixel.github.io/dashboard/assets/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:image:alt" content="ملف Excel يتحول إلى داش بورد تفاعلي">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://muniraalarbash-pixel.github.io/dashboard/assets/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%230F3D3A%22/%3E%3Cpath%20d%3D%22M12%2044%20L24%2034%20L34%2039%20L52%2018%22%20fill%3D%22none%22%20stroke%3D%22%23F5DABF%22%20stroke-width%3D%225.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%2252%22%20cy%3D%2218%22%20r%3D%225.5%22%20fill%3D%22%23C9443F%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Alexandria:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
<div class="view-wrap">
  <div class="demo-bar" id="demo-bar" hidden>
    <a class="brand" href="index.html" style="font-size:16px"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" class="lg-bg"/><path d="M12 44 L24 34 L34 39 L52 18" fill="none" class="lg-ln" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="18" r="5.5" class="lg-dot"/></svg>عرض تجريبي</a>
    <div class="tabs" role="tablist" id="demo-tabs"></div>
    <a class="btn btn-primary btn-sm" href="index.html#login">أنشئ داش بورد خاص بك</a>
  </div>
  <div id="gate" class="gate card" hidden>
    <h1 id="gate-title" style="font-size:20px"></h1>
    <p class="muted" id="gate-msg"></p>
    <form id="gate-form" class="auth" hidden novalidate>
      <label class="field"><span class="label">كلمة المرور</span><input type="password" id="gate-pass" autocomplete="current-password"></label>
      <button class="btn btn-primary" type="submit">فتح الداش بورد</button>
      <p class="status err" id="gate-err" role="status" aria-live="polite"></p>
    </form>
  </div>
  <div class="exportbar" id="xbar" hidden><span class="xs" id="xst" role="status" aria-live="polite"></span><button type="button" class="btn btn-quiet btn-sm" data-export="png">حفظ كصورة</button><button type="button" class="btn btn-quiet btn-sm" data-export="pdf">تحميل PDF</button></div>
  <div id="dash"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module">
import { sb, $, toast } from './assets/js/sb.js';
import { wireExport } from './assets/js/export.js';
let curTitle = '';
wireExport(() => ({ el: document.querySelector('#dash .dash'), title: curTitle }), m => { $('#xst').textContent = m; });
import { mountDashboard, TEMPLATES } from './assets/js/render.js';

const qs = new URLSearchParams(location.search);
let dash = null, lastStamp = null, pass = null;

function gate(title, msg, withForm) {
  $('#gate').hidden = false; $('#gate-title').textContent = title; $('#gate-msg').textContent = msg; $('#gate-form').hidden = !withForm;
  if (withForm) $('#gate-pass').focus();
}

if (qs.get('demo')) {
  const { SAMPLE } = await import('./assets/js/sample.js');
  const proj = { ...SAMPLE.project };
  $('#demo-bar').hidden = false;
  const tabs = () => { $('#demo-tabs').innerHTML = Object.entries(TEMPLATES).map(([k, t]) => `<button type="button" role="tab" data-t="${k}" aria-selected="${proj.template === k}">${t.name}</button>`).join(''); };
  tabs();
  $('#demo-tabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; proj.template = b.dataset.t; tabs(); dash.setTemplate(proj.template); });
  document.title = proj.title + ' | داش بورد';
  dash = mountDashboard($('#dash'), { project: proj, version: SAMPLE.version, previous: SAMPLE.previous });
  curTitle = proj.title; $('#xbar').hidden = false;
} else {
  const slug = qs.get('s');
  if (!slug || !sb) gate('الرابط غير صحيح', 'تأكد من نسخ رابط المشاركة كاملًا.', false);
  else {
    async function fetchShared(first) {
      const { data, error } = await sb.rpc('get_shared', { p_slug: slug, p_pass: pass });
      if (error) { if (first) gate('تعذّر فتح الداش بورد', 'حاول مرة أخرى بعد قليل.', false); return; }
      if (data.error === 'not_found') { gate('الداش بورد غير متاح', 'قد يكون الرابط متوقفًا أو غير صحيح.', false); return; }
      if (data.error === 'password' || data.error === 'wrong_password') {
        gate(data.title || 'داش بورد محمي', 'هذا الداش بورد محمي بكلمة مرور.', true);
        if (data.error === 'wrong_password') $('#gate-err').textContent = 'كلمة المرور غير صحيحة.';
        return;
      }
      $('#gate').hidden = true;
      const stamp = (data.version && data.version.created_at) + '|' + data.project.updated_at;
      if (stamp === lastStamp) return;
      const opts = { project: data.project, version: data.version, previous: data.previous };
      document.title = data.project.title + ' | داش بورد';
      if (!dash) dash = mountDashboard($('#dash'), opts); else { dash.update(opts); toast('تم تحديث البيانات'); }
      curTitle = data.project.title; $('#xbar').hidden = !data.version;
      lastStamp = stamp;
      // count one view per visitor session (owner visits are ignored by the database)
      try { const k = 'viewed-' + slug; if (!sessionStorage.getItem(k)) { sessionStorage.setItem(k, '1'); sb.rpc('log_view', { p_slug: slug }).then(() => {}, () => {}); } } catch (e) {}
    }
    $('#gate-form').addEventListener('submit', e => { e.preventDefault(); pass = $('#gate-pass').value; $('#gate-err').textContent = ''; fetchShared(true); });
    await fetchShared(true);
    // auto-refresh: pick up new uploads without reloading the page
    setInterval(() => { if (document.visibilityState === 'visible' && lastStamp) fetchShared(false); }, 120000);
  }
}
</script>
</body>
</html>
