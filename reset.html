<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="index.html"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" class="lg-bg"/><path d="M12 44 L24 34 L34 39 L52 18" fill="none" class="lg-ln" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="18" r="5.5" class="lg-dot"/></svg><span class="sr">لوحة المؤشرات</span></a>
  <nav class="nav" id="nav"></nav>
</div></header>
<main class="wrap">
  <div class="gate card">
    <h1 style="font-size:22px">تعيين كلمة مرور جديدة</h1>
    <p class="muted" id="intro">لحظة، نتحقق من الرابط…</p>
    <form class="auth" id="reset-form" hidden novalidate>
      <label class="field"><span class="label">كلمة المرور الجديدة</span><input type="password" id="p1" autocomplete="new-password" minlength="6" dir="ltr" required></label>
      <label class="field"><span class="label">أعد كتابتها</span><input type="password" id="p2" autocomplete="new-password" minlength="6" dir="ltr" required></label>
      <button class="btn btn-primary" type="submit" id="save">حفظ كلمة المرور</button>
      <p class="status" id="st" role="status" aria-live="polite"></p>
    </form>
    <a class="btn btn-quiet" href="index.html#login" id="back" hidden>الرجوع لتسجيل الدخول</a>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.js"></script>
<script type="module">
import { sb, $, mountNav } from './assets/js/sb.js';
mountNav(null);
const show = () => { $('#intro').textContent = 'اكتب كلمة مرور جديدة من 6 أحرف أو أكثر.'; $('#reset-form').hidden = false; $('#p1').focus(); };
const fail = () => { $('#intro').textContent = 'الرابط غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا من صفحة تسجيل الدخول.'; $('#back').hidden = false; };
let ready = false;
sb.auth.onAuthStateChange((ev, session) => { if ((ev === 'PASSWORD_RECOVERY' || (ev === 'SIGNED_IN' && session)) && !ready) { ready = true; show(); } });
const hasToken = /access_token|code=|type=recovery/.test(location.hash + location.search);
setTimeout(async () => { if (ready) return; const { data } = await sb.auth.getSession(); if (data.session && hasToken) { ready = true; show(); } else fail(); }, 2500);
$('#reset-form').addEventListener('submit', async e => {
  e.preventDefault();
  const st = $('#st'), a = $('#p1').value, b = $('#p2').value;
  st.classList.remove('err');
  if (a.length < 6) { st.textContent = 'كلمة المرور لازم تكون 6 أحرف أو أكثر.'; st.classList.add('err'); return; }
  if (a !== b) { st.textContent = 'الكلمتين غير متطابقتين.'; st.classList.add('err'); return; }
  $('#save').disabled = true; st.textContent = 'جاري الحفظ…';
  const { error } = await sb.auth.updateUser({ password: a });
  $('#save').disabled = false;
  if (error) { st.textContent = /different|same/i.test(error.message) ? 'اختر كلمة مرور مختلفة عن القديمة.' : 'تعذّر الحفظ: ' + error.message; st.classList.add('err'); return; }
  st.textContent = 'تم تغيير كلمة المرور. ننقلك لحسابك…';
  setTimeout(() => { location.href = 'app.html'; }, 1200);
});
</script>
</body>
</html>
